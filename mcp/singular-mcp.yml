    http_status: 200
other_mcp_endpoints:
  - url: https://www.singular.net/wp-json/mcp/mcp-oauth-server
    host: www.singular.net
    status: published
    http_status: 401
    scopes: [mcp]
    note: >-
      A second, separate MCP endpoint served by Singular's WordPress marketing site via the
      WP MCP adapter plugin (namespace `mcp`; routes /mcp, /mcp/mcp-oauth-server,
      /mcp/mcp-adapter-default-server). It advertises RFC 8414 + RFC 9728 metadata at
      www.singular.net and answers tools/list with an RFC 9728 Bearer challenge. This is the
      website's content surface, NOT the marketing-data product server above.
