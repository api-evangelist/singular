name: Singular
description: >-
  Singular (Singular Labs, Inc.) is a mobile measurement partner (MMP) and marketing
  analytics platform that unifies attribution, cost aggregation, fraud prevention, ad
  monetization, and cross-platform analytics into a single source of truth. It aggregates
  campaign, cost, ad-revenue, and creative data from 1,200+ sources, measures omnichannel
  ROI across mobile, web, CTV, PC, and console, and powers deep linking, SKAdNetwork/SKAN
  reporting, audience activation, and marketing ETL. Singular exposes a broad REST surface
  under api.singular.net — asynchronous reporting, SKAdNetwork reporting, ad-monetization
  reporting, tracking-link management, custom fraud rules, and partner configuration — plus
  server-to-server session/event ingestion at s2s.singular.net, an OpenDSR (GDPR/CCPA)
  subject-request API at gdpr.singular.net, and a first-party remote MCP server at
  mcp.singular.net that lets ChatGPT, Claude, Cursor, Copilot, and Gemini query live campaign
  data in natural language. First-party iOS, Android, Unity, Flutter, React Native, Cordova,
  and Web SDKs instrument attribution on the client side. Used by brands including Airbnb,
  Lyft, and Rovio.
