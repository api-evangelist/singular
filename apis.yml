- name: Singular Server-to-Server (S2S) API
  description: >-
    Server-side ingestion endpoints for reporting sessions/launches and in-app events without
    a client SDK — used for PC, console, CTV, web, and server-authoritative mobile
    integrations. Session notification at /api/v1/launch and event notification at /api/v2/evt.
    Responses always return HTTP 200; success is signalled by a body status field.
  humanURL: https://support.singular.net/hc/en-us/articles/17499952586779-PC-Console-API-Endpoint-Reference
  baseURL: https://s2s.singular.net
  tags:
  - Server-to-Server
