- name: Singular MCP
  description: >-
    First-party remote Model Context Protocol server. Translates a natural-language prompt
    into a Singular reporting query, runs it against the connecting user's own account under
    that user's permissions, and returns aggregated marketing data plus field context to the
    LLM. OAuth 2.0 authorization_code + PKCE, scope mcp:read, with RFC 8414 / RFC 9728
    metadata and dynamic client registration. Supported in ChatGPT, Claude, Cursor, VS Code
    Copilot, and Gemini CLI.
  humanURL: https://support.singular.net/hc/en-us/articles/37923459892507-Singular-MCP
  baseURL: https://mcp.singular.net
  tags:
  - MCP
  - AI
  - Reporting
