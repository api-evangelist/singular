- name: Singular OpenDSR (GDPR) API
  description: >-
    OpenDSR/OpenGDPR-conformant data subject request API. An anonymous discovery endpoint
    publishes the supported identity types and subject-request types (erasure, access);
    authenticated endpoints submit, poll, and cancel subject requests.
