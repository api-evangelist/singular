apis:
- name: Singular Reporting API
  description: >-
    Asynchronous REST API for programmatically pulling Singular's unified marketing data —
    attribution, cost, ad revenue, and creative metrics — as standardized, warehouse-ready
    reports. Create a report, poll get_report_status, then download the result. Companion
    metadata endpoints enumerate filters, custom dimensions, cohort metrics, conversion
    metrics, and per-source data availability.
  humanURL: https://support.singular.net/hc/en-us/articles/360045245692-Reporting-API-Reference
  baseURL: https://api.singular.net
