exhaustion:
  status: 429
  body: '{"status": 1, "substatus": 1, "value": "Too many requests. Maximum allowed are 10 requests in a minute"}'
  guidance: >-
    "If receiving 429 errors, reduce request rate and implement request throttling to stay
    within limits." Singular directs callers to exponential backoff with jitter (see
    errors/singular-error-codes.yml).
