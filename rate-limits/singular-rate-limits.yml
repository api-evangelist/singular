note: >-
  Singular publishes real, per-product limits in its reference — unusually specific for this
  category. What it does NOT publish is any rate-limit RESPONSE HEADER: there is no
  X-RateLimit-*, RateLimit-* or Retry-After documented anywhere, and an unauthenticated probe
  returns none. An agent therefore cannot read its remaining budget at runtime; it only learns
  it is over the line when a 429 arrives. Recorded here as an honest gap.
