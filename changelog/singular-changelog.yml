scheme:
  type: dated product-update log
  versioned: false
  note: >-
    Singular publishes a single continuously-updated, date-stamped "Product Updates" article
    tagged by product area (Reporting, Links, MCP, Integrations, Fraud Prevention, Audiences,
    SDKs, Data Connectors). It is not a semver release feed and carries no explicit
    breaking-change flag — breaking items are called out in prose. There is no changelog RSS
    or JSON feed; the Zendesk Help Center REST API
    (/api/v2/help_center/en-us/articles/360061042971.json) is the only machine-readable route
    to it, and its `updated_at` is the freshness signal.
  api_release_notes: >-
    API-affecting changes appear in this same feed rather than in a separate API changelog;
    the S2S Event endpoint V1→V2 cutover, for example, is announced in the endpoint reference
    (accounts created on or after 2026-07-15 must use V2).
window: recent (most recent entries only; the live article is the source of truth)
