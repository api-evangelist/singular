third_party_integrations:
  note: >-
    First-party Singular adapters published for other vendors' SDKs; official Singular code,
    but distributed through the host vendor's plugin ecosystem rather than a Singular package.
  packages:
    - {name: mparticle-android-integration-singular, repo: 'https://github.com/singular-labs/mparticle-android-integration-singular'}
    - {name: mparticle-apple-integration-singular, repo: 'https://github.com/singular-labs/mparticle-apple-integration-singular'}
    - {name: mparticle-javascript-integration-singular, repo: 'https://github.com/singular-labs/mparticle-javascript-integration-singular'}
    - {name: segment-singular-android, repo: 'https://github.com/singular-labs/segment-singular-android'}
    - {name: segment-singular-ios, repo: 'https://github.com/singular-labs/segment-singular-ios'}
    - {name: singular_looker_blocks, repo: 'https://github.com/singular-labs/singular_looker_blocks'}
notes: >-
  Singular publishes 12 first-party client libraries across 8 languages/platforms from
  github.com/singular-labs (100+ public repos, most of them forks of infrastructure
  dependencies). There is no server-side SDK in any language other than Python, and the Python
  one wraps only the Reporting API — the Links, Fraud, Partner Config, S2S and OpenDSR APIs
  have no client library at all. Two distribution channels are stale relative to the shipping
  code: CocoaPods (2020) and the Kids SDK variants (2022 or unversioned).
